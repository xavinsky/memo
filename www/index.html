<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Science — Aide-mémoire</title>
<script>
(function(){
  var z = parseFloat(localStorage.getItem("memo-zoom"));
  if (!z || isNaN(z)) z = 1;
  document.documentElement.style.zoom = z * 1.2;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root{
    --bg: #F5F7FB;
    --sidebar-bg: #0E1420;
    --sidebar-hover: #182136;
    --sidebar-active: #1D2A47;
    --sidebar-text: #8B96AC;
    --sidebar-text-active: #F5F7FB;
    --ink: #172033;
    --muted: #6B7686;
    --line: #E1E5EE;
    --numpy: #3D6EFF;
    --pandas: #E8993D;
    --math: #2E9E6D;
    --plot: #7C5CFC;
    --stats: #1F9FBF;
    --regression: #D9455F;
    --dash: #C2478A;
    --ml: #CC9A1F;
    --dl: #9B4FD9;
    --code-tint: #EEF2FF;
    --result-tint: #FFF6EA;
    --lex: #3B6FA0;
    --tools: #6B7686;
    --cheat: #C9932E;
    --dataviz: #7C5CFC;
    --data: #2E8B7A;
    --misc: #5A67D8;
    --tab-concepts: #2E9E6D;
    --tab-syntaxes: #3D6EFF;
    --tab-lexique: #6D28D9;
    --tab-refs: #7A4A26;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  html{scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }

  /* ---------- SIDEBAR (partagée) ---------- */
  #sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    height:100vh;
    position:sticky;
    top:0;
    overflow-y:auto;
    padding:28px 0 40px;
    --tab-current: var(--sidebar-active);
  }
  #sidebar[data-page="concepts"]{ --tab-current: var(--tab-concepts); }
  #sidebar[data-page="syntaxes"]{ --tab-current: var(--tab-syntaxes); }
  #sidebar[data-page="lexique"]{ --tab-current: var(--tab-lexique); }
  #sidebar[data-page="references"]{ --tab-current: var(--tab-refs); }
  #sidebar .brand{
    padding:0 24px 14px;
  }
  #sidebar .brand h1{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    color:#fff;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  #sidebar .brand p{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--sidebar-text);
    margin:0;
  }
  .top-tabs{
    display:flex;
    gap:3px;
    padding:0 24px;
    border-bottom:2px solid var(--tab-current);
    transition:border-color 0.15s ease;
  }
  .top-tab{
    flex:1;
    text-align:center;
    padding:7px 4px 9px;
    margin-bottom:-2px;
    border-radius:7px 7px 0 0;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--sidebar-text);
    text-decoration:none;
    border:none;
    background:none;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .top-tab[data-page="concepts"]{ background:rgba(46,158,109,0.18); color:#8FE0BE; }
  .top-tab[data-page="concepts"]:hover{ background:rgba(46,158,109,0.32); color:#fff; }
  .top-tab[data-page="concepts"].active{ background:var(--tab-concepts); color:#fff; }
  .top-tab[data-page="syntaxes"]{ background:rgba(61,110,255,0.18); color:#A9BEFF; }
  .top-tab[data-page="syntaxes"]:hover{ background:rgba(61,110,255,0.32); color:#fff; }
  .top-tab[data-page="syntaxes"].active{ background:var(--tab-syntaxes); color:#fff; }
  .top-tab[data-page="lexique"]{ background:rgba(109,40,217,0.18); color:#C4B0F5; }
  .top-tab[data-page="lexique"]:hover{ background:rgba(109,40,217,0.32); color:#fff; }
  .top-tab[data-page="lexique"].active{ background:var(--tab-lexique); color:#fff; }
  .top-tab[data-page="references"]{ background:rgba(122,74,38,0.24); color:#E3C2A0; }
  .top-tab[data-page="references"]:hover{ background:rgba(122,74,38,0.4); color:#fff; }
  .top-tab[data-page="references"].active{ background:var(--tab-refs); color:#fff; }
  .zoom-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .zoom-controls button{
    width:24px;
    height:24px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,0.14);
    background:var(--sidebar-hover);
    color:var(--sidebar-text-active);
    font-family:var(--font-mono);
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .zoom-controls button:hover{background:var(--sidebar-active);}
  .zoom-controls #zoom-level{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--sidebar-text);
    min-width:34px;
    text-align:center;
  }
  .search-box{padding:0 24px 14px;}
  .search-box input{
    width:100%;
    box-sizing:border-box;
    background:var(--sidebar-hover);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--sidebar-text-active);
    border-radius:6px;
    padding:7px 9px;
    font-family:var(--font-mono);
    font-size:12px;
    outline:none;
  }
  .search-box input::placeholder{color:var(--sidebar-text);}
  .search-box input:focus{border-color:#9DB4FF;}
  .search-nav{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .search-nav button{
    width:24px;
    height:24px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,0.14);
    background:var(--sidebar-hover);
    color:var(--sidebar-text-active);
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .search-nav button:hover{background:var(--sidebar-active);}
  .search-nav button:disabled{opacity:0.35; cursor:default;}
  .search-nav #search-count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--sidebar-text);
    min-width:42px;
    text-align:center;
  }
  mark.search-mark{background:#FFE58A; color:inherit; border-radius:2px; padding:0 1px;}
  mark.search-mark.current{background:#FFB020; box-shadow:0 0 0 2px rgba(255,176,32,0.5);}
  .sidebar-footer{
    position:fixed;
    left:0; bottom:0;
    width:280px;
    box-sizing:border-box;
    padding:12px 24px;
    background:var(--sidebar-bg);
    border-top:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sidebar-footer .last-updated{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--sidebar-text);
  }

  /* ---------- Conteneurs par page (nav + main) ---------- */
  .page-navbody{display:none; padding-top:1px; padding-bottom:96px; transition:background 0.15s ease;}
  .page-navbody.active{display:block; background:color-mix(in srgb, var(--tab-current) 26%, var(--sidebar-bg));}
  .page-main{display:none;}
  .page-main.active{display:block;}

  .nav-group{margin-top:22px;}
  .nav-group-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:10px 24px 9px;
    border-top:3px solid transparent;
    border-bottom:1px solid transparent;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .nav-group-label .label-text{flex:1;}
  .nav-group-label .chevron{
    font-size:10px;
    opacity:0.5;
    transition:transform 0.15s ease;
    transform:rotate(0deg);
  }
  .nav-group.collapsed .nav-group-label .chevron{transform:rotate(-90deg);}
  .nav-group-items{overflow:hidden;}
  .nav-group.collapsed .nav-group-items{display:none;}
  .nav-group-label.numpy{color:#9DB4FF; border-top-color:var(--numpy); border-bottom-color:var(--numpy);}
  .nav-group-label.pandas{color:#F4C583; border-top-color:var(--pandas); border-bottom-color:var(--pandas);}
  .nav-group-label.math{color:#8DE0BE; border-top-color:var(--math); border-bottom-color:var(--math);}
  .nav-group-label.plot{color:#C9BBFF; border-top-color:var(--plot); border-bottom-color:var(--plot);}
  .nav-group-label.stats{color:#9FE0EE; border-top-color:var(--stats); border-bottom-color:var(--stats);}
  .nav-group-label.regression{color:#FFB3C6; border-top-color:var(--regression); border-bottom-color:var(--regression);}
  .nav-group-label.dash{color:#EBA8CF; border-top-color:var(--dash); border-bottom-color:var(--dash);}
  .nav-group-label.ml{color:#F0CF6B; border-top-color:var(--ml); border-bottom-color:var(--ml);}
  .nav-group-label.dl{color:#D6B8F5; border-top-color:var(--dl); border-bottom-color:var(--dl);}
  .nav-group-label.tools{color:#B7C0D6; border-top-color:var(--tools); border-bottom-color:var(--tools);}
  .nav-group-label.misc{color:#B4BBF5; border-top-color:var(--misc); border-bottom-color:var(--misc);}
  .nav-group-label.data{color:#7FD9C4; border-top-color:var(--data); border-bottom-color:var(--data);}
  .nav-group-label.lexique{color:#C4B0F5; border-top-color:var(--tab-lexique); border-bottom-color:var(--tab-lexique);}
  .nav-group-label.other{color:#B7C0D6; border-top-color:var(--muted); border-bottom-color:var(--muted);}

  .nav-subgroup{margin-top:2px;}
  .nav-subgroup-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:lowercase;
    color:#B7C0D6;
    padding:10px 24px 9px 20px;
    border-bottom:1px solid transparent;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
  }
  .nav-subgroup-label:hover{opacity:0.8;}
  .nav-subgroup-label .label-text{flex:1;}
  .nav-subgroup-label.numpy{color:#9DB4FF; border-bottom-color:var(--numpy);}
  .nav-subgroup-label.pandas{color:#F4C583; border-bottom-color:var(--pandas);}
  .nav-subgroup-label.math{color:#8DE0BE; border-bottom-color:var(--math);}
  .nav-subgroup-label.plot{color:#C9BBFF; border-bottom-color:var(--plot);}
  .nav-subgroup-label.stats{color:#9FE0EE; border-bottom-color:var(--stats);}
  .nav-subgroup-label.regression{color:#FFB3C6; border-bottom-color:var(--regression);}
  .nav-subgroup-label.dash{color:#EBA8CF; border-bottom-color:var(--dash);}
  .nav-subgroup-label.ml{color:#F0CF6B; border-bottom-color:var(--ml);}
  .nav-subgroup-label.dl{color:#D6B8F5; border-bottom-color:var(--dl);}
  .nav-subgroup-label .chevron{
    font-size:9px;
    opacity:0.6;
    transition:transform 0.15s ease;
    transform:rotate(0deg);
  }
  .nav-subgroup.collapsed .nav-subgroup-label .chevron{transform:rotate(-90deg);}
  .nav-subgroup-items{overflow:hidden;}
  .nav-subgroup.collapsed .nav-subgroup-items{display:none;}
  .nav-subgroup-items .nav-item{padding-left:34px;}

  .nav-item{
    display:flex;
    align-items:baseline;
    gap:10px;
    width:100%;
    padding:9px 24px;
    background:none;
    border:none;
    border-left:3px solid transparent;
    text-align:left;
    text-decoration:none;
    color:var(--sidebar-text);
    font-family:var(--font-body);
    font-size:13.5px;
    cursor:pointer;
    transition:background 0.12s ease, color 0.12s ease;
  }
  .nav-item:hover{background:var(--sidebar-hover); color:#D5DBE8;}
  .nav-item.active{
    background:var(--tab-current);
    color:#fff;
  }
  .nav-item.active.numpy{border-left-color:var(--numpy);}
  .nav-item.active.pandas{border-left-color:var(--pandas);}
  .nav-item.active.math{border-left-color:var(--math);}
  .nav-item.active.plot{border-left-color:var(--plot);}
  .nav-item.active.stats{border-left-color:var(--stats);}
  .nav-item.active.regression{border-left-color:var(--regression);}
  .nav-item.active.dash{border-left-color:var(--dash);}
  .nav-item.active.ml{border-left-color:var(--ml);}
  .nav-item.active.dl{border-left-color:var(--dl);}
  .nav-item.active.tools{border-left-color:var(--tools);}
  .nav-item.active.misc{border-left-color:var(--misc);}
  .nav-item.active.data{border-left-color:var(--data);}

  /* Lexique — nav par lettre */
  .nav-letters{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:4px;
    padding:12px 20px 4px;
  }
  .nav-letter{
    display:block;
    text-align:center;
    padding:6px 0;
    border-radius:6px;
    background:none;
    border:1px solid transparent;
    color:var(--sidebar-text);
    font-family:var(--font-mono);
    font-size:12.5px;
    text-decoration:none;
    cursor:pointer;
  }
  .nav-letter:hover{background:var(--sidebar-hover); color:var(--sidebar-text-active);}
  .nav-letter.active{background:var(--tab-current); color:#fff; border-color:rgba(255,255,255,0.1);}

  /* Lexique — nuage de tags sur 2 niveaux : groupe (tag plein), puis ses sous-groupes (petits tags), toujours visibles */
  .nav-tag-cloud{padding:10px 20px 16px;}
  .nav-tag-group{margin-bottom:10px;}
  .nav-tag-group:last-child{margin-bottom:0;}
  .nav-tag{
    display:inline-block;
    padding:5px 12px;
    border-radius:14px;
    background:var(--sidebar-hover);
    border:1px solid transparent;
    font-family:var(--font-body);
    font-size:12.5px;
    text-decoration:none;
    color:var(--sidebar-text);
    transition:background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .nav-tag:hover{color:var(--sidebar-text-active);}
  .nav-tag.ml{border-color:var(--ml); color:#F0CF6B;}
  .nav-tag.dl{border-color:var(--dl); color:#D6B8F5;}
  .nav-tag.math{border-color:var(--math); color:#8DE0BE;}
  .nav-tag.regression{border-color:var(--regression); color:#FFB3C6;}
  .nav-tag.other{border-color:var(--muted); color:#B7C0D6;}
  .nav-tag-sub-row{display:flex; flex-wrap:wrap; gap:4px; margin:5px 0 0 6px;}
  .nav-tag-sub{
    display:inline-block;
    padding:2px 8px;
    border-radius:9px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.12);
    font-family:var(--font-body);
    font-size:10.5px;
    text-decoration:none;
    color:var(--sidebar-text);
    opacity:0.8;
    transition:opacity 0.12s ease, color 0.12s ease;
  }
  .nav-tag-sub:hover{opacity:1; color:var(--sidebar-text-active);}
  .nav-tag-sub.ml{border-color:rgba(204,154,31,0.4);}
  .nav-tag-sub.dl{border-color:rgba(155,79,217,0.4);}
  .nav-tag-sub.math{border-color:rgba(46,158,109,0.4);}
  .nav-tag-sub.regression{border-color:rgba(217,69,95,0.4);}
  .nav-tag-sub.other{border-color:rgba(107,118,134,0.4);}

  /* ---------- MAIN (partagée) ---------- */
  #main-root{
    flex:1;
    min-width:0;
    padding:44px 56px 80px;
    max-width:1216px;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .panel-header{margin-bottom:24px;}
  .panel-eyebrow{
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:0.1em;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .panel-eyebrow .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .panel-eyebrow.numpy{color:#3D6EFF;}
  .panel-eyebrow.numpy .dot{background:var(--numpy);}
  .panel-eyebrow.pandas{color:#B96F13;}
  .panel-eyebrow.pandas .dot{background:var(--pandas);}
  .panel-eyebrow.math{color:#1F7A54;}
  .panel-eyebrow.math .dot{background:var(--math);}
  .panel-eyebrow.plot{color:#5B3FCB;}
  .panel-eyebrow.plot .dot{background:var(--plot);}
  .panel-eyebrow.stats{color:#15748C;}
  .panel-eyebrow.stats .dot{background:var(--stats);}
  .panel-eyebrow.regression{color:#B23A55;}
  .panel-eyebrow.regression .dot{background:var(--regression);}
  .panel-eyebrow.dash{color:#9C2F6E;}
  .panel-eyebrow.dash .dot{background:var(--dash);}
  .panel-eyebrow.ml{color:#8F6B10;}
  .panel-eyebrow.ml .dot{background:var(--ml);}
  .panel-eyebrow.dl{color:#7331A8;}
  .panel-eyebrow.dl .dot{background:var(--dl);}
  .panel-eyebrow.tools{color:var(--muted);}
  .panel-eyebrow.tools .dot{background:var(--tools);}
  .panel-eyebrow.misc{color:#4A50B0;}
  .panel-eyebrow.misc .dot{background:var(--misc);}
  .panel-eyebrow.data{color:#1F6B57;}
  .panel-eyebrow.data .dot{background:var(--data);}
  .panel-header h2{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }

  /* ---------- SYNTAXES : tableaux ---------- */
  .syntax-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .syntax-table thead th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    font-weight:500;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    background:#FAFBFD;
  }
  .syntax-table tbody td{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    vertical-align:top;
    line-height:1.55;
  }
  .syntax-table tbody tr:last-child td{border-bottom:none;}
  td.col-objectif{color:var(--ink); width:26%;}
  td.col-syntaxe{
    background:var(--code-tint);
    font-family:var(--font-mono);
    font-size:12.5px;
    color:#1F2A5C;
    width:42%;
  }
  td.col-syntaxe code{white-space:pre-wrap; display:block;}
  td.col-syntaxe code strong, .broken-code strong{
    background:#BFDBFE;
    padding:0 3px;
    border-radius:3px;
    font-weight:700;
  }
  .broken-code{
    display:block;
    color:#9AA3B5;
    text-decoration:line-through;
    text-decoration-color:#C94A4A;
    margin-bottom:6px;
    font-size:12.5px;
  }
  .mini-label{
    font-family:var(--font-body);
    font-size:11px;
    color:inherit;
    opacity:0.7;
    margin:8px 0 3px;
  }
  .mini-table{
    background:#fff;
    border:1px solid rgba(31,42,92,0.15);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:8px;
    white-space:pre-wrap;
    font-size:12px;
    color:#1F2A5C;
  }
  td.col-resultat{
    background:var(--result-tint);
    color:#5C3F14;
    width:32%;
    white-space:pre-wrap;
    font-family:var(--font-mono);
    font-size:12px;
  }
  td.col-nom{color:var(--ink); width:20%;}
  td.col-formule{
    background:var(--code-tint);
    font-family:var(--font-mono);
    font-size:12.5px;
    color:#1F2A5C;
    width:32%;
    white-space:pre-wrap;
  }
  td.col-formule code{white-space:pre-wrap; display:block;}
  td.col-formule strong{
    background:#BFDBFE;
    padding:0 3px;
    border-radius:3px;
    font-weight:700;
  }
  td.col-params{
    background:#EAF7F0;
    color:#1F6B4A;
    width:24%;
    font-family:var(--font-mono);
    font-size:12px;
  }
  .param-line{
    line-height:1.5;
    margin-bottom:8px;
  }
  .param-line:last-child{margin-bottom:0;}
  td.col-explication{
    background:var(--result-tint);
    color:#5C3F14;
    width:24%;
    white-space:pre-wrap;
    font-family:var(--font-mono);
    font-size:12px;
  }
  .syntax-table td .katex-display{
    margin:6px 0;
    overflow-x:auto;
    overflow-y:hidden;
  }
  td.col-formule .katex-display{
    background:#fff;
    border:1px solid rgba(31,42,92,0.12);
    border-radius:6px;
    padding:8px 10px;
    margin:0 0 8px;
  }
  td.col-formule .katex{
    background:#fff;
    border:1px solid rgba(31,42,92,0.12);
    border-radius:5px;
    padding:2px 6px;
    display:inline-block;
    margin-bottom:6px;
  }
  td.col-formule .katex-display .katex{
    background:none;
    border:none;
    padding:0;
    margin:0;
    display:inline;
  }
  td.col-params .katex{
    background:#fff;
    border:1px solid rgba(31,111,74,0.2);
    border-radius:4px;
    padding:0px 5px;
    display:inline-block;
  }
  .compat-note{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed rgba(31,42,92,0.25);
    font-family:var(--font-body);
    font-size:11.5px;
    line-height:1.5;
    color:#8A5A12;
  }
  .compat-note b{font-weight:500; color:#5C3F14;}

  /* ---------- CONCEPTS : cards ---------- */
  .concept-body{max-width:720px;}
  .concept-intro{
    font-size:15px;
    line-height:1.7;
    color:var(--muted);
    margin:0 0 24px;
  }
  .concept-block{margin:0 0 20px;}
  .block-text{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink);
    margin:0 0 20px;
  }
  .block-text strong, .step-text strong, .compare-text strong, .block-note strong, .concept-mini-table strong{
    color:#0F1729;
    background:#EDEBFF;
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }
  .tag-p, .tag-np{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:700;
    padding:0 6px;
    border-radius:9px;
    line-height:1.6;
    margin-left:2px;
  }
  .tag-p{color:#6D28D9; background:#EDE7FC;}
  .tag-np{color:#15803D; background:#DAF5E4;}
  .model-tag{display:inline-block; padding:1px 8px; border-radius:6px; font-weight:600; position:relative;}
  .model-tag-p{background:#EDE7FC; color:#6D28D9;}
  .model-tag-np{background:#DAF5E4; color:#15803D;}
  .model-tag .tag-suffix{font-family:var(--font-mono); font-weight:700; font-size:10px; opacity:0.85;}
  .model-tag[data-tooltip]{cursor:help; border-bottom:1px dashed currentColor;}
  a.model-tag{text-decoration:none;}
  a.model-tag.model-tag-link{cursor:pointer; border-bottom:1.5px solid currentColor;}
  a.model-tag.model-tag-link:hover{filter:brightness(0.92);}
  .model-tag[data-tooltip]::after{
    content:attr(data-tooltip);
    position:absolute;
    left:50%;
    bottom:calc(100% + 6px);
    transform:translateX(-50%);
    background:#172033;
    color:#fff;
    font-weight:500;
    font-size:11.5px;
    white-space:nowrap;
    padding:4px 8px;
    border-radius:5px;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.12s ease;
    z-index:20;
    pointer-events:none;
  }
  .model-tag[data-tooltip]:hover::after{opacity:1; visibility:visible;}
  .block-diagram{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 12px;
    margin:0 0 20px;
    overflow-x:auto;
  }
  .block-diagram svg{display:block; margin:0 auto; min-width:640px;}
  .flow-box{fill:#fff; stroke:#C7CEDE; stroke-width:1.4;}
  .flow-box.q{fill:#FBF3DC; stroke:var(--ml);}
  .flow-box.leaf{fill:#E6F0FC; stroke:#2C6FBB;}
  .flow-label{font-family:var(--font-body); font-size:12.5px; font-weight:600; fill:var(--ink);}
  .flow-label.q-label{fill:#8A6510; font-weight:600;}
  .flow-label.leaf-label{fill:#1D4F8C; font-weight:700; font-size:14.5px;}
  .flow-line{stroke:#C7CEDE; stroke-width:1.4; fill:none;}
  .flow-arrow{fill:#C7CEDE;}
  .edge-chip{fill:var(--code-tint); stroke:none;}
  .edge-text{font-family:var(--font-mono); font-size:10.5px; fill:var(--muted); text-anchor:middle;}
  .leaf-link{cursor:pointer;}
  .leaf-link:hover .flow-box.leaf{stroke-width:2.2;}
  .leaf-link:hover .flow-label.leaf-label{text-decoration:underline;}
  .phase-flow{
    display:flex;
    align-items:stretch;
    gap:2px;
    margin:0 0 4px;
  }
  .phase-card{
    flex:1;
    min-width:0;
    border-radius:10px;
    padding:10px 12px;
    background:#FBF3DC;
    border:1.4px solid var(--ml);
  }
  .phase-card.deploy{background:#E6F0FC; border-color:#2C6FBB;}
  .phase-card-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:12.5px;
    color:#8A6510;
    margin:0 0 6px;
  }
  .phase-card.deploy .phase-card-title{color:#1D4F8C;}
  .phase-steps{margin:0; padding:0; list-style:none;}
  .phase-steps li{
    font-size:11px;
    line-height:1.5;
    color:var(--muted);
    padding:1px 0;
  }
  .phase-steps li .step-no{font-family:var(--font-mono); color:#98A2B8; margin-right:3px;}
  .phase-steps a{color:inherit; text-decoration:none;}
  .phase-steps a.step-link-blue{color:#1D4F8C;}
  .phase-steps a:hover{text-decoration:underline;}
  .pipeline-tag{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:9px;
    font-weight:700;
    color:#1D4F8C;
    background:#E6F0FC;
    padding:1px 5px;
    border-radius:8px;
    margin-right:4px;
    vertical-align:middle;
  }
  .phase-arrow{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    width:20px;
    color:#98A2B8;
    font-size:15px;
  }
  @media (max-width:820px){
    .phase-flow{flex-direction:column;}
    .phase-arrow{width:100%; height:16px; transform:rotate(90deg);}
  }
  .block-text.with-divider, .category-block.with-divider{border-top:1px solid var(--line); padding-top:18px; margin-top:6px;}
  .category-block{margin:0 0 14px;}
  .category-badge{
    display:inline-block;
    background:#E6F0FC;
    border:1.5px solid #2C6FBB;
    color:#1D4F8C;
    border-radius:10px;
    padding:6px 16px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
  }
  .category-desc{margin:0; font-size:13.5px; line-height:1.55; color:var(--muted);}
  .compare-card.role-p{background:#F5F0FE; border-color:rgba(109,40,217,0.35);}
  .compare-card.role-p .compare-label{color:#6D28D9;}
  .compare-card.role-np{background:#EFFBF3; border-color:rgba(21,128,61,0.35);}
  .compare-card.role-np .compare-label{color:#15803D;}
  .block-formula{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 24px;
    margin:0 0 20px;
    text-align:center;
    overflow-x:auto;
  }
  .block-formula .katex{font-size:1.1em;}
  .concept-steps{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    counter-reset:step-counter;
  }
  .concept-steps li{
    position:relative;
    padding:0 0 20px 36px;
    margin:0;
  }
  .concept-steps li:last-child{padding-bottom:0;}
  .concept-steps li::before{
    counter-increment:step-counter;
    content:counter(step-counter);
    position:absolute;
    left:0; top:0;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-mono);
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .concept-steps li::after{
    content:"";
    position:absolute;
    left:11px; top:24px; bottom:0;
    width:1px;
    background:var(--line);
  }
  .concept-steps li:last-child::after{display:none;}
  .step-text{font-size:14px; line-height:1.65; padding-top:2px;}
  .block-compare{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:12px;
    margin:0 0 20px;
  }
  .compare-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
  }
  .compare-label{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink);
  }
  .compare-text{font-size:13px; line-height:1.55; color:var(--muted);}
  .block-code{
    background:var(--code-tint);
    border:1px solid rgba(31,42,92,0.12);
    border-radius:8px;
    padding:12px 16px;
    margin:0 0 20px;
    font-family:var(--font-mono);
    font-size:12.5px;
    color:#1F2A5C;
    white-space:pre-wrap;
    overflow-x:auto;
  }
  .block-code strong{background:#BFDBFE; padding:0 3px; border-radius:3px; font-weight:700;}
  .block-note{
    border-left:4px solid var(--math);
    background:#F4FBF7;
    border-radius:0 8px 8px 0;
    padding:12px 16px;
    margin:0 0 20px;
    font-size:13.5px;
    line-height:1.6;
    color:#1F5C3F;
  }
  .block-note.warning{border-left-color:#D9455F; background:#FDF3F5; color:#7A2438;}

  .compare-card.role-outer{border-color:rgba(46,111,130,0.4);}
  .compare-card.role-outer .compare-label{color:#2E6F82;}
  .compare-card.role-inner{border-color:rgba(156,59,49,0.4);}
  .compare-card.role-inner .compare-label{color:#9C3B31;}

  .concept-mini-table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 20px;
    font-size:13px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .concept-mini-table th, .concept-mini-table td{
    border:1px solid var(--line);
    padding:8px 10px;
    text-align:center;
  }
  .concept-mini-table th{
    background:var(--code-tint);
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .block-table-wrap{overflow-x:auto;}

  .concept-derivation{
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin:0 0 20px;
    background:#fff;
  }
  .derivation-step{padding:18px 22px;}
  .derivation-step + .derivation-step{border-top:1px solid var(--line);}
  .derivation-step-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:10px;
  }
  .derivation-num{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:12px;
    color:var(--muted);
    flex-shrink:0;
  }
  .derivation-title{
    font-family:var(--font-display);
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
  }
  .derivation-step-body .concept-block:last-child{margin-bottom:0;}

  /* ---------- LEXIQUE ---------- */
  .page-header{margin-bottom:8px;}
  .page-eyebrow{
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:0.1em;
    color:var(--lex);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .page-eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--lex); display:inline-block;}
  .page-header h2{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .page-intro{
    font-size:14px;
    line-height:1.65;
    color:var(--muted);
    margin:0 0 32px;
    max-width:640px;
  }
  .lex-letter{margin-bottom:32px;}
  .lex-letter-heading{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:600;
    color:var(--lex);
    border-bottom:2px solid var(--lex);
    padding-bottom:6px;
    margin:0 0 4px;
    scroll-margin-top:20px;
  }
  .lex-entry{padding:14px 0; border-bottom:1px solid var(--line);}
  .lex-entry:last-child{border-bottom:none;}
  .lex-term{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin-bottom:4px;
  }
  .lex-def{font-size:13.5px; line-height:1.6; color:var(--muted); margin:0;}
  .lex-def a{color:var(--lex); text-decoration:none; border-bottom:1px solid rgba(59,111,160,0.35);}
  .lex-def a:hover{border-bottom-color:var(--lex);}
  .lex-def code{
    font-family:var(--font-mono);
    font-size:12.5px;
    background:#EEF2FF;
    padding:0 4px;
    border-radius:3px;
    color:#1F2A5C;
  }
  .lex-section-divider{border:none; border-top:1px solid var(--line); margin:40px 0 32px;}

  /* Vue groupée : cadres de groupe en colonnes (masonry CSS, largeur au contenu plutôt que pleine largeur),
     chacun contenant un cadre par sous-groupe, puis des puces cliquables (nom seul, sans définition) qui
     renvoient vers la liste alphabétique ci-dessus. Titres en "légende" posée sur la bordure (comme un
     fieldset) pour éviter la ligne de titre vide sur toute la largeur du cadre. */
  #lex-grouped{
    column-width:360px;
    column-gap:20px;
  }
  .lex-group-card{
    position:relative;
    display:inline-block;
    width:100%;
    box-sizing:border-box;
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:20px 18px 16px;
    margin:0 0 20px;
    background:#FAFBFE;
    scroll-margin-top:20px;
    vertical-align:top;
  }
  .lex-group-card-title{
    position:absolute;
    top:-11px;
    left:14px;
    background:#FAFBFE;
    padding:0 8px;
    font-family:var(--font-display);
    font-size:14.5px;
    font-weight:700;
    margin:0;
  }
  .lex-group-card.ml{border-color:var(--ml);} .lex-group-card.ml .lex-group-card-title{color:var(--ml);}
  .lex-group-card.dl{border-color:var(--dl);} .lex-group-card.dl .lex-group-card-title{color:var(--dl);}
  .lex-group-card.math{border-color:var(--math);} .lex-group-card.math .lex-group-card-title{color:var(--math);}
  .lex-group-card.regression{border-color:var(--regression);} .lex-group-card.regression .lex-group-card-title{color:var(--regression);}
  .lex-group-card.other{border-color:var(--muted);} .lex-group-card.other .lex-group-card-title{color:var(--muted);}

  .lex-subgroup-card{
    position:relative;
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:0 8px 8px 0;
    background:#fff;
    padding:14px 14px 12px;
    margin:10px 0 0;
    scroll-margin-top:20px;
  }
  .lex-subgroup-card:first-of-type{margin-top:4px;}
  .lex-subgroup-card-title{
    position:absolute;
    top:-9px;
    left:11px;
    background:#fff;
    padding:0 6px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    color:var(--ink);
    margin:0;
  }
  .lex-group-card.ml .lex-subgroup-card{border-left-color:var(--ml);}
  .lex-group-card.dl .lex-subgroup-card{border-left-color:var(--dl);}
  .lex-group-card.math .lex-subgroup-card{border-left-color:var(--math);}
  .lex-group-card.regression .lex-subgroup-card{border-left-color:var(--regression);}
  .lex-group-card.other .lex-subgroup-card{border-left-color:var(--muted);}

  /* Sous-sous-groupe : niveau optionnel à l'intérieur d'un cadre de sous-groupe trop grand (pas de cadre propre, juste un petit titre) */
  .lex-subsubgroup{margin-top:10px;}
  .lex-subsubgroup:first-child{margin-top:0;}
  .lex-subsubgroup-title{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--muted);
    margin:0 0 6px;
  }

  .lex-term-chips{display:flex; flex-wrap:wrap; gap:6px 8px;}
  .lex-term-chip{
    display:inline-block;
    font-size:12px;
    line-height:1.4;
    padding:4px 10px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#F5F7FB;
    color:var(--ink);
    text-decoration:none;
    transition:background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .lex-group-card.ml .lex-term-chip:hover{border-color:var(--ml); color:var(--ml); background:#fff;}
  .lex-group-card.dl .lex-term-chip:hover{border-color:var(--dl); color:var(--dl); background:#fff;}
  .lex-group-card.math .lex-term-chip:hover{border-color:var(--math); color:var(--math); background:#fff;}
  .lex-group-card.regression .lex-term-chip:hover{border-color:var(--regression); color:var(--regression); background:#fff;}
  .lex-group-card.other .lex-term-chip:hover{border-color:var(--muted); color:var(--ink); background:#fff;}
  .lex-entry{scroll-margin-top:20px;}
  .lex-entry:target{animation:lex-flash 1.6s ease;}
  @keyframes lex-flash{
    0%{background:#FFF3C4;}
    100%{background:transparent;}
  }

  /* ---------- REFERENCES ---------- */
  .ref-subheading{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin:24px 0 10px;
  }
  .ref-subheading:first-child{margin-top:0;}
  .ref-subheading .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .linklist{
    margin:0;
    font-size:13.5px;
    line-height:2;
  }
  .linklist p{margin:0;}
  .linklist a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .linklist a:hover{border-bottom-color:currentColor;}

  /* mobile */
  @media (max-width:820px){
    body{flex-direction:column;}
    #sidebar{
      width:100%;
      height:auto;
      position:relative;
      padding:16px 0;
    }
    #sidebar .brand{padding:0 16px 14px;}
    .search-box{padding:0 16px 14px;}
    .top-tabs{padding:0 16px;}
    .sidebar-footer{position:static; width:100%; margin-top:14px;}
    .page-navbody{padding-bottom:0;}
    .nav-group{margin-top:14px;}
    #main-root{padding:28px 18px 60px; max-width:100%;}
    .block-compare{grid-template-columns:1fr;}
    .derivation-step{padding:14px 16px;}
    .syntax-table, .syntax-table thead, .syntax-table tbody, .syntax-table th, .syntax-table td, .syntax-table tr{display:block;}
    .syntax-table thead{display:none;}
    .syntax-table tbody tr{
      border-bottom:1px solid var(--line);
      padding:12px 0;
    }
    .syntax-table tbody tr:last-child{border-bottom:none;}
    .syntax-table td{border-bottom:none !important; padding:6px 16px !important; width:auto !important;}
    .syntax-table td.col-objectif{font-weight:500;}
    .syntax-table td.col-nom{font-weight:500;}
    .syntax-table td::before{
      content:attr(data-label);
      display:block;
      font-family:var(--font-mono);
      font-size:10px;
      letter-spacing:0.08em;
      color:var(--muted);
      margin-bottom:3px;
    }
  }
</style>
</head>
<body>

<nav id="sidebar" data-page="concepts">
  <div class="brand">
    <h1>Data Science</h1>
    <p id="brand-subtitle">concepts &amp; fondations</p>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Rechercher… ( / )" autocomplete="off">
    <div class="search-nav">
      <button id="search-prev" type="button" aria-label="Résultat précédent" disabled>↑</button>
      <span id="search-count"></span>
      <button id="search-next" type="button" aria-label="Résultat suivant" disabled>↓</button>
    </div>
  </div>

  <div class="top-tabs">
    <button type="button" class="top-tab active" data-page="concepts">Concepts</button>
    <button type="button" class="top-tab" data-page="syntaxes">Syntaxes</button>
    <button type="button" class="top-tab" data-page="lexique">Lexique</button>
    <button type="button" class="top-tab" data-page="references">Refs</button>
  </div>

  <div id="navbody-concepts" class="page-navbody active"></div>
  <div id="navbody-syntaxes" class="page-navbody"></div>
  <div id="navbody-lexique" class="page-navbody">
    <div class="nav-group">
      <div class="nav-group-label lexique"><span class="label-text">Alphabétique</span></div>
      <div class="nav-letters" id="nav-letters"></div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label lexique"><span class="label-text">Groupe</span></div>
      <div class="nav-tag-cloud" id="nav-lex-groups"></div>
    </div>
  </div>
  <div id="navbody-references" class="page-navbody"></div>

  <div class="sidebar-footer">
    <div class="zoom-controls">

<script>
/* ---------- Zoom (partagé) ---------- */
const ZOOM_KEY = "memo-zoom", ZOOM_MIN = 0.8, ZOOM_MAX = 1.6, ZOOM_STEP = 0.1, ZOOM_BASE = 1.2;
let currentZoom = parseFloat(localStorage.getItem(ZOOM_KEY)) || 1;
function applyZoom(z){
  currentZoom = Math.round(Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)) * 100) / 100;
  document.documentElement.style.zoom = currentZoom * ZOOM_BASE;
  localStorage.setItem(ZOOM_KEY, currentZoom);
  document.getElementById("zoom-level").textContent = Math.round(currentZoom * 100) + "%";
}
document.getElementById("zoom-out").addEventListener("click", () => {
  applyZoom(currentZoom - ZOOM_STEP);
});
document.getElementById("zoom-in").addEventListener("click", () => {
  applyZoom(currentZoom + ZOOM_STEP);
});
applyZoom(currentZoom);

/* ---------- Helpers communs ---------- */
function escapeHtml(str){
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- Rendu Concepts (blocks) ---------- */
function richHtml(str){
  // [[NP:Classe]], [[NP:Classe|Nom convivial]] ou [[NP:Classe|Nom convivial|id-de-page]] —
  // le nom convivial (s'il est fourni) s'affiche en infobulle au survol ; l'id (s'il est fourni)
  // transforme le badge en lien cliquable vers la carte Concepts correspondante.
  function modelTag(match, tagClass, tagSuffix){
    const parts = match.split('|');
    const name = parts[0];
    const friendly = parts[1];
    const target = parts[2];
    // &#91;/&#93; plutôt que [/] : évite que le remplacement générique [P]/[NP] plus bas ne re-matche ce suffixe déjà généré
    const inner = name + '<span class="tag-suffix"> &#91;' + tagSuffix + '&#93;</span>';
    const tooltipAttr = friendly ? ' data-tooltip="' + friendly + '"' : '';
    if (target){
      return '<a href="#' + target + '" class="model-tag ' + tagClass + ' model-tag-link"' + tooltipAttr + ' onclick="showSection(\'' + target + '\'); return false;">' + inner + '</a>';
    }
    return '<span class="model-tag ' + tagClass + '"' + tooltipAttr + '>' + inner + '</span>';
  }
  return escapeHtml(str)
    .replace(/\[([^\]]+)\]\(#([a-z0-9-]+)\)/g, '<a href="#$2" onclick="showSection(\'$2\'); return false;">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[\[NP:(.+?)\]\]/g, (m, g1) => modelTag(g1, 'model-tag-np', 'NP'))
    .replace(/\[\[P:(.+?)\]\]/g, (m, g1) => modelTag(g1, 'model-tag-p', 'P'))
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\[NP\]/g, '<span class="tag-np">[NP]</span>')
    .replace(/\[P\]/g, '<span class="tag-p">[P]</span>');
}

function renderBlock(container, block){
  if (block.type === 'category'){
    const wrap = document.createElement('div');
    wrap.className = 'concept-block category-block' + (block.divider ? ' with-divider' : '');
    if (block.id) wrap.id = block.id;
    const badge = document.createElement('span');
    badge.className = 'category-badge';
    badge.textContent = block.label;
    wrap.appendChild(badge);
    const desc = document.createElement('p');
    desc.className = 'category-desc';
    desc.innerHTML = richHtml(block.description);
    wrap.appendChild(desc);
    container.appendChild(wrap);
  } else if (block.type === 'text'){
    const p = document.createElement('p');
    p.className = 'concept-block block-text' + (block.divider ? ' with-divider' : '');
    if (block.id) p.id = block.id;
    p.innerHTML = richHtml(block.html);
    container.appendChild(p);
  } else if (block.type === 'formula'){
    const div = document.createElement('div');
    div.className = 'concept-block block-formula';
    div.textContent = '$$' + block.tex + '$$';
    container.appendChild(div);
  } else if (block.type === 'steps'){
    const ol = document.createElement('ol');
    ol.className = 'concept-block concept-steps';
    block.items.forEach(item => {
      const li = document.createElement('li');
      const txt = document.createElement('div');
      txt.className = 'step-text';
      txt.innerHTML = richHtml(item);
      li.appendChild(txt);
      ol.appendChild(li);
    });
    container.appendChild(ol);
  } else if (block.type === 'compare'){
    const div = document.createElement('div');
    div.className = 'concept-block block-compare';
    block.items.forEach(it => {
      const card = document.createElement('div');
      card.className = 'compare-card' + (it.role ? ' role-' + it.role : '');
      const label = document.createElement('div');
      label.className = 'compare-label';
      label.innerHTML = richHtml(it.label);
      const text = document.createElement('div');
      text.className = 'compare-text';
      text.innerHTML = richHtml(it.text);
      card.appendChild(label);
      card.appendChild(text);
      div.appendChild(card);
    });
    container.appendChild(div);
  } else if (block.type === 'code'){
    const wrap = document.createElement('div');
    wrap.className = 'concept-block block-code';
    const code = document.createElement('code');
    code.innerHTML = richHtml(block.code);
    wrap.appendChild(code);
    container.appendChild(wrap);
  } else if (block.type === 'note'){
    const div = document.createElement('div');
    div.className = 'concept-block block-note ' + (block.style || 'tip');
    div.innerHTML = richHtml(block.html);
    container.appendChild(div);
  } else if (block.type === 'table'){
    const wrap = document.createElement('div');
    wrap.className = 'concept-block block-table-wrap';
    const table = document.createElement('table');
    table.className = 'concept-mini-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr>' + block.headers.map(h => '<th>' + richHtml(h) + '</th>').join('') + '</tr>';
    const tbody = document.createElement('tbody');
    block.rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = row.map(c => '<td>' + richHtml(c) + '</td>').join('');
      tbody.appendChild(tr);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
  } else if (block.type === 'diagram'){
    const wrap = document.createElement('div');
    wrap.className = 'concept-block block-diagram';
    wrap.innerHTML = block.svg;
    container.appendChild(wrap);
  } else if (block.type === 'derivation'){
    const wrap = document.createElement('div');
    wrap.className = 'concept-block concept-derivation';
    block.steps.forEach((step, idx) => {
      const stepEl = document.createElement('div');
      stepEl.className = 'derivation-step';
      if (step.id) stepEl.id = step.id;
      const head = document.createElement('div');
      head.className = 'derivation-step-head';
      const num = document.createElement('span');
      num.className = 'derivation-num';
      num.textContent = step.num !== undefined ? step.num : idx + (block.startIndex || 0);
      const title = document.createElement('span');
      title.className = 'derivation-title';
      title.innerHTML = richHtml(step.title);
      head.appendChild(num);
      head.appendChild(title);
      stepEl.appendChild(head);
      const body = document.createElement('div');
      body.className = 'derivation-step-body';
      (step.blocks || []).forEach(b => renderBlock(body, b));
      stepEl.appendChild(body);
      wrap.appendChild(stepEl);
    });
    container.appendChild(wrap);
  }
}

/* ---------- Rendu Syntaxes (tables) ---------- */
function setCodeHtml(el, text){
  el.innerHTML = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function renderSyntaxContent(container, content){
  if (Array.isArray(content)){
    content.forEach(seg => {
      if (seg.code !== undefined){
        const code = document.createElement('code');
        setCodeHtml(code, seg.code);
        container.appendChild(code);
      } else if (seg.table !== undefined){
        const tableBlock = document.createElement('div');
        tableBlock.className = 'mini-table';
        tableBlock.textContent = seg.table;
        container.appendChild(tableBlock);
      } else if (seg.label !== undefined){
        const label = document.createElement('div');
        label.className = 'mini-label';
        label.textContent = seg.label;
        container.appendChild(label);
      }
    });
  } else if (container.classList.contains('col-syntaxe')) {
    const code = document.createElement('code');
    setCodeHtml(code, content);
    container.appendChild(code);
  } else if (container.classList.contains('col-params')) {
    content.split('\n').forEach(line => {
      const div = document.createElement('div');
      div.className = 'param-line';
      div.textContent = line;
      container.appendChild(div);
    });
  } else {
    setCodeHtml(container, content);
  }
}
function renderSyntaxTable(panel, sec){
  const table = document.createElement('table');
  table.className = 'syntax-table';
  const thead = document.createElement('thead');
  const headers = sec.headers || ["Objectif", "Syntaxe", "Résultat"];
  const colClasses = sec.colClasses || ["col-objectif", "col-syntaxe", "col-resultat"];
  thead.innerHTML = '<tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr>';
  const tbody = document.createElement('tbody');
  sec.rows.forEach((row) => {
    const tr = document.createElement('tr');
    const broken = row.length > headers.length ? row[row.length - 1] : undefined;
    headers.forEach((label, idx) => {
      const td = document.createElement('td');
      td.className = colClasses[idx] || ('col-c' + idx);
      td.dataset.label = label;
      if (idx === 1 && broken){
        const brokenCode = document.createElement('code');
        brokenCode.className = 'broken-code';
        setCodeHtml(brokenCode, broken);
        td.appendChild(brokenCode);
      }
      renderSyntaxContent(td, row[idx]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  panel.appendChild(table);
}

/* ---------- Constructeur générique nav-group/nav-subgroup/panel ---------- */
function buildPanelPage(sections, groupLabels, navRootEl, mainRootEl, renderPanelBody){
  let currentGroup = null, currentSubgroup = null, itemsWrapper = null, subItemsWrapper = null;
  sections.forEach((sec) => {
    if (sec.group !== currentGroup){
      currentGroup = sec.group;
      currentSubgroup = null;
      subItemsWrapper = null;
      const thisGroupWrapper = document.createElement('div');
      thisGroupWrapper.className = 'nav-group collapsed';
      const label = document.createElement('div');
      label.className = 'nav-group-label ' + sec.group;
      label.innerHTML = '<span class="label-text">' + groupLabels[sec.group] + '</span><span class="chevron">▾</span>';
      label.addEventListener('click', () => thisGroupWrapper.classList.toggle('collapsed'));
      thisGroupWrapper.appendChild(label);
      const thisItemsWrapper = document.createElement('div');
      thisItemsWrapper.className = 'nav-group-items';
      thisGroupWrapper.appendChild(thisItemsWrapper);
      navRootEl.appendChild(thisGroupWrapper);
      itemsWrapper = thisItemsWrapper;
    }
    if (sec.subgroup && sec.subgroup !== currentSubgroup){
      currentSubgroup = sec.subgroup;
      const thisSubgroupWrapper = document.createElement('div');
      thisSubgroupWrapper.className = 'nav-subgroup collapsed';
      const subLabel = document.createElement('div');
      subLabel.className = 'nav-subgroup-label ' + sec.group;
      subLabel.innerHTML = '<span class="label-text">' + sec.subgroup + '</span><span class="chevron">▾</span>';
      subLabel.addEventListener('click', () => thisSubgroupWrapper.classList.toggle('collapsed'));
      thisSubgroupWrapper.appendChild(subLabel);
      const thisSubItemsWrapper = document.createElement('div');
      thisSubItemsWrapper.className = 'nav-subgroup-items';
      thisSubgroupWrapper.appendChild(thisSubItemsWrapper);
      itemsWrapper.appendChild(thisSubgroupWrapper);
      subItemsWrapper = thisSubItemsWrapper;
    } else if (!sec.subgroup){
      currentSubgroup = null;
      subItemsWrapper = null;
    }
    const targetWrapper = subItemsWrapper || itemsWrapper;
    const btn = document.createElement('button');
    btn.className = 'nav-item ' + sec.group;
    btn.dataset.target = sec.id;
    const titleSpan = document.createElement('span');
    titleSpan.textContent = sec.title;
    btn.appendChild(titleSpan);
    btn.addEventListener('click', () => showSection(sec.id));
    targetWrapper.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel';
    panel.id = 'panel-' + sec.id;

    const header = document.createElement('div');
    header.className = 'panel-header';
    const eyebrow = document.createElement('div');
    eyebrow.className = 'panel-eyebrow ' + sec.group;
    eyebrow.innerHTML = '<span class="dot"></span>' + groupLabels[sec.group];
    const h2 = document.createElement('h2');
    h2.textContent = sec.title;
    header.appendChild(eyebrow);
    header.appendChild(h2);
    panel.appendChild(header);

    renderPanelBody(panel, sec);
    mainRootEl.appendChild(panel);
  });
}

/* ---------- groupLabels par page (namespace séparé : "ml" a un libellé différent en Concepts et en Syntaxes) ---------- */
const CONCEPTS_GROUP_LABELS = {math:"Maths &amp; Probabilités", ml:"Machine Learning", dl:"Deep Learning"};
const SYNTAXES_GROUP_LABELS = {numpy:"Numpy", pandas:"Pandas", plot:"Matplotlib &amp; Seaborn", stats:"Scipy.stats", regression:"Statsmodels &amp; Régression", ml:"Scikit-learn (Machine Learning)", dash:"Dash (Dashboarding)", dl:"Keras (Deep Learning)"};

buildPanelPage(CONCEPTS_SECTIONS, CONCEPTS_GROUP_LABELS, document.getElementById('navbody-concepts'), document.getElementById('mainpage-concepts'), (panel, sec) => {

/* ---------- Rendu Lexique (liste continue par lettre) ---------- */
function firstLetter(term){
  return term.replace(/[^A-Za-zÀ-ÿ].*$/, '').charAt(0).toUpperCase();
}
const navLettersEl = document.getElementById('nav-letters');
const lexContentEl = document.getElementById('lex-content');
let currentLetter = null;
let letterSection = null;
function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
// Étiquette compacte d'une puce du nuage de tags : un terme "ACRONYME (développement)" ou
// "Nom complet (ACRONYME)" n'affiche que l'acronyme (le développement reste visible dans la liste alphabétique)
function chipLabel(t){
  const m = t.match(/^(.+?)\s*\(([^)]+)\)$/);
  if (!m) return t;
  const [, before, inside] = m;
  const isAcronym = s => s.length >= 2 && s.length <= 8 && /^[A-ZÀ-Ý0-9][A-ZÀ-Ý0-9-]*$/.test(s);
  if (isAcronym(before)) return before;
  if (isAcronym(inside)) return inside;
  return t;
}
LEXIQUE_TERMS.forEach((entry) => {
  const letter = firstLetter(entry.t);
  if (letter !== currentLetter){
    currentLetter = letter;
    const navLink = document.createElement('a');
    navLink.className = 'nav-letter';
    navLink.href = '#lex-' + letter.toLowerCase();
    navLink.textContent = letter;
    navLettersEl.appendChild(navLink);

    letterSection = document.createElement('section');
    letterSection.className = 'lex-letter';
    letterSection.id = 'lex-' + letter.toLowerCase();
    const heading = document.createElement('h2');
    heading.className = 'lex-letter-heading';
    heading.textContent = letter;
    letterSection.appendChild(heading);
    lexContentEl.appendChild(letterSection);
  }
  const entryEl = document.createElement('div');
  entryEl.className = 'lex-entry';
  entryEl.id = 'lexterm-' + slugify(entry.t);
  const termEl = document.createElement('div');
  termEl.className = 'lex-term';
  termEl.textContent = entry.t;
  const defEl = document.createElement('p');
  defEl.className = 'lex-def';
  defEl.innerHTML = entry.d;
  entryEl.appendChild(termEl);
  entryEl.appendChild(defEl);
  letterSection.appendChild(entryEl);
});

/* ---------- Rendu Lexique (regroupé par groupe & sous-groupe — noms seuls, liens vers la liste alphabétique ci-dessus) ---------- */
// "Machine Learning" est scindé en 2 groupes d'affichage à peu près égaux (~47/~49 termes) — un seul
// cadre "ml" était démesuré par rapport aux autres. "Modèles" = quels modèles/algorithmes existent ;
// "Workflow" = tout le reste du pipeline (préparation des données, métriques, entraînement, tuning,
// tests). "Statsmodels & Régression" (VIF/Multicolinéarité) est absorbé dans Workflow plutôt que de
// rester un groupe à part (pas de raison de l'isoler de Machine Learning).
const LEX_GROUP_LABELS = {"ml-models":"Machine Learning — Modèles", "ml-workflow":"Machine Learning — Workflow", dl:"Deep Learning", math:"Maths &amp; Probabilités", other:"Autres / transverses"};
const LEX_GROUP_CSS_CLASS = {"ml-models":"ml", "ml-workflow":"ml", dl:"dl", math:"math", other:"other"};
const ML_MODELS_SUBGROUPS = ["Concepts Modèles", "Modèles"];
function lexTopGroup(rawGroup, subgroup){
  if (rawGroup === 'ml') return ML_MODELS_SUBGROUPS.includes(subgroup) ? 'ml-models' : 'ml-workflow';
  if (rawGroup === 'regression') return 'ml-workflow';
  return rawGroup;
}
// Quelques sous-groupes très fins (1-3 termes) sont fusionnés dans un sous-groupe voisin déjà existant,
// avec son nom complet (jamais d'abréviation) — évite une multitude de mini-cadres presque vides.
const LEX_SUBGROUP_RENAME = {
  ml: {"Transformation":"Data Preparation", "Choix du modèle":"Model Tuning", "Régularisation & Tuning":"Model Tuning"},
};
// Sous-sous-groupes : seuls les sous-groupes dépassant ~10 termes sont éclatés davantage, par thème
// (identifié via l'id de la section Concepts/Syntaxes ciblée par chaque terme).
const LEX_ID_TO_SUBSUBGROUP = {
  "ml-metrics-classification":"Métriques de classification", "ml-roc-auc":"Métriques de classification", "ml-precision-recall-tradeoff":"Métriques de classification",
  "ml-metrics-regression":"Métriques de régression",
  // "Test" — validation (méthode) puis diagnostic des résultats obtenus avec cette méthode
  "ml-holdout":"Validation", "ml-cross-validation-concept":"Validation",
  "ml-bias-variance":"Bias/Variance & diagnostic", "ml-error-analysis":"Bias/Variance & diagnostic",
  // "Modèles" (types concrets) — regroupe aussi Time Series et NLP, qui sont eux-mêmes des familles de modèles
  "ml-ensemble-methods":"Ensemble Methods",
  "ml-decision-tree":"Arbres de décision",
  "ml-svm-margin":"SVM", "ml-svm-kernels":"SVM",
  "ml-regularization":"Régularisation",
  "ml-kmeans":"Unsupervised Learning", "ml-pca":"Unsupervised Learning",
  "ts-decomposition":"Décomposition & Stationnarité", "ts-stationarity":"Décomposition & Stationnarité",
  "ts-autocorrelation":"Autocorrélation & modèles ARIMA", "ts-ar-ma":"Autocorrélation & modèles ARIMA", "ts-arima":"Autocorrélation & modèles ARIMA",
  "nlp-preprocessing":"NLP", "nlp-vectorizing":"NLP", "nlp-naive-bayes":"NLP", "nlp-lda":"NLP",
  "bayes-naive-bayes":"Théorème de Bayes",
  "lois-discretes":"Lois de probabilité discrètes", "variable-aleatoire":"Lois de probabilité discrètes",
  "ensembles-base":"Théorie des ensembles",
};
const LEX_SUBSUBGROUP_ORDER = {
  "ml-workflow|Métriques": ["Métriques de classification","Métriques de régression"],
  "ml-workflow|Test": ["Validation","Bias/Variance & diagnostic"],
  "ml-models|Modèles": ["Ensemble Methods","Arbres de décision","SVM","Régularisation","Unsupervised Learning","Décomposition & Stationnarité","Autocorrélation & modèles ARIMA","NLP"],
  "math|Probabilités & lois": ["Théorème de Bayes","Lois de probabilité discrètes","Théorie des ensembles"],
};
// Quelques termes du Lexique ne renvoient vers aucune section Concepts/Syntaxes dédiée (pas de href) —
// classés ici à la main plutôt que dans une section "Autres / transverses".
const LEX_MANUAL_SECTION = {
  "Cross-Entropy": {group:"ml", subgroup:"Entraînement (fit)"},
  "Hyperparamètre": {group:"ml", subgroup:"Concepts Modèles"},
  "MAP (Maximum a Posteriori)": {group:"math", subgroup:"Probabilités & lois"},
  "Curse of Dimensionality (fléau de la dimension)": {group:"ml", subgroup:"Data Preparation"},
};
// Section (id -> group/subgroup) connue à partir des cartes Concepts & Syntaxes déjà chargées
const lexIdToSection = {};
CONCEPTS_SECTIONS.forEach(s => lexIdToSection[s.id] = {group:s.group, subgroup:s.subgroup || null});
SYNTAXES_SECTIONS.forEach(s => { if(!(s.id in lexIdToSection)) lexIdToSection[s.id] = {group:s.group, subgroup:s.subgroup || null}; });
// Ordre des groupes / sous-groupes = ordre naturel des fichiers de données (mêmes priorités que la sidebar Concepts/Syntaxes),
// après passage par lexTopGroup() pour éclater "ml" en 2 groupes d'affichage et absorber "regression" dans Workflow.
const lexGroupOrder = [];
const lexSubgroupOrderByGroup = {};
[...CONCEPTS_SECTIONS, ...SYNTAXES_SECTIONS].forEach(s => {
  let rawSubgroup = s.group === 'regression' ? 'Statsmodels & Régression' : s.subgroup;
  rawSubgroup = (LEX_SUBGROUP_RENAME[s.group] && LEX_SUBGROUP_RENAME[s.group][rawSubgroup]) || rawSubgroup;
  const topGroup = lexTopGroup(s.group, rawSubgroup);
  if (!lexGroupOrder.includes(topGroup)) lexGroupOrder.push(topGroup);
  if (rawSubgroup){
    if (!lexSubgroupOrderByGroup[topGroup]) lexSubgroupOrderByGroup[topGroup] = [];
    if (!lexSubgroupOrderByGroup[topGroup].includes(rawSubgroup)) lexSubgroupOrderByGroup[topGroup].push(rawSubgroup);
  }
});
lexGroupOrder.push('other');

// Regroupe les termes du Lexique par group -> subgroup -> subsubgroup (optionnel), dans l'ordre défini ci-dessus
const lexByGroup = {};
LEXIQUE_TERMS.forEach(entry => {
  const m = entry.d.match(/href="#([\w-]+)"/);
  const id = m ? m[1] : null;
  const section = id ? lexIdToSection[id] : null;
  const manual = LEX_MANUAL_SECTION[entry.t];
  const rawGroup = section ? section.group : (manual ? manual.group : 'other');
  let rawSubgroup = section && section.subgroup ? section.subgroup : (manual ? manual.subgroup : 'Général');
  if (rawGroup === 'regression') rawSubgroup = 'Statsmodels & Régression';
  const subgroup = (LEX_SUBGROUP_RENAME[rawGroup] && LEX_SUBGROUP_RENAME[rawGroup][rawSubgroup]) || rawSubgroup;
  const group = lexTopGroup(rawGroup, subgroup);
  const subsubgroup = id && LEX_ID_TO_SUBSUBGROUP[id] ? LEX_ID_TO_SUBSUBGROUP[id] : null;
  if (!lexByGroup[group]) lexByGroup[group] = {};
  if (!lexByGroup[group][subgroup]) lexByGroup[group][subgroup] = {_flat: []};
  const bucket = lexByGroup[group][subgroup];
  if (subsubgroup){
    if (!bucket[subsubgroup]) bucket[subsubgroup] = [];
    bucket[subsubgroup].push(entry);
  } else {
    bucket._flat.push(entry);
  }
});

const navLexGroupsEl = document.getElementById('nav-lex-groups');
const lexGroupedEl = document.getElementById('lex-grouped');
lexGroupOrder.filter(g => lexByGroup[g]).forEach(group => {
  // Nuage de tags de la sidebar, sur 2 niveaux : le groupe (tag plein), puis ses sous-groupes
  // (petits tags juste en dessous) — toujours visibles, pas d'accordéon à déplier.
  const groupCardClass = LEX_GROUP_CSS_CLASS[group] || 'other';
  const navTagGroup = document.createElement('div');
  navTagGroup.className = 'nav-tag-group';
  const navTag = document.createElement('a');
  navTag.className = 'nav-tag ' + groupCardClass;
  navTag.href = '#lexg-' + slugify(group);
  navTag.innerHTML = LEX_GROUP_LABELS[group] || group;
  navTagGroup.appendChild(navTag);
  const navSubTagRow = document.createElement('div');
  navSubTagRow.className = 'nav-tag-sub-row';
  navTagGroup.appendChild(navSubTagRow);
  navLexGroupsEl.appendChild(navTagGroup);

  const groupBlock = document.createElement('div');
  groupBlock.className = 'lex-group-card ' + groupCardClass;
  groupBlock.id = 'lexg-' + slugify(group);
  const groupHeading = document.createElement('h2');
  groupHeading.className = 'lex-group-card-title';
  groupHeading.innerHTML = LEX_GROUP_LABELS[group] || group;
  groupBlock.appendChild(groupHeading);
  lexGroupedEl.appendChild(groupBlock);

  const subgroups = Object.keys(lexByGroup[group]);
  const orderedSubgroups = (lexSubgroupOrderByGroup[group] || []).filter(sg => subgroups.includes(sg))
    .concat(subgroups.filter(sg => !(lexSubgroupOrderByGroup[group] || []).includes(sg)));
  orderedSubgroups.forEach(subgroup => {
    const subgroupId = 'lexg-' + slugify(group) + '-' + slugify(subgroup);
    const navSubTag = document.createElement('a');
    navSubTag.className = 'nav-tag-sub ' + groupCardClass;
    navSubTag.href = '#' + subgroupId;
    navSubTag.textContent = subgroup;
    navSubTagRow.appendChild(navSubTag);

    const subgroupCard = document.createElement('div');
    subgroupCard.className = 'lex-subgroup-card';
    subgroupCard.id = subgroupId;
    const subgroupTitle = document.createElement('h3');
    subgroupTitle.className = 'lex-subgroup-card-title';
    subgroupTitle.textContent = subgroup;
    subgroupCard.appendChild(subgroupTitle);

    function appendChips(container, entries){
      const chipsWrap = document.createElement('div');
      chipsWrap.className = 'lex-term-chips';
      // Si raccourcir deux termes du même paquet donne la même étiquette (ex: "Soft Margin (SVM)" et
      // "Support Vector Machine (SVM)" -> "SVM" tous les deux), on revient au nom complet pour lever l'ambiguïté
      const labels = entries.map(e => chipLabel(e.t));
      const counts = {};
      labels.forEach(l => { counts[l] = (counts[l] || 0) + 1; });
      entries.forEach((entry, i) => {
        const chip = document.createElement('a');
        chip.className = 'lex-term-chip';
        chip.href = '#lexterm-' + slugify(entry.t);
        chip.textContent = counts[labels[i]] > 1 ? entry.t : labels[i];
        chipsWrap.appendChild(chip);
      });
      container.appendChild(chipsWrap);
    }

    const bucket = lexByGroup[group][subgroup];
    if (bucket._flat.length) appendChips(subgroupCard, bucket._flat);
    const subsubKey = group + '|' + subgroup;
    const subsubNames = Object.keys(bucket).filter(k => k !== '_flat');
    const orderedSubsub = (LEX_SUBSUBGROUP_ORDER[subsubKey] || []).filter(n => subsubNames.includes(n))
      .concat(subsubNames.filter(n => !(LEX_SUBSUBGROUP_ORDER[subsubKey] || []).includes(n)));
    orderedSubsub.forEach(subsubgroup => {
      const subsubBlock = document.createElement('div');
      subsubBlock.className = 'lex-subsubgroup';
      const subsubTitle = document.createElement('h4');
      subsubTitle.className = 'lex-subsubgroup-title';
      subsubTitle.textContent = subsubgroup;
      subsubBlock.appendChild(subsubTitle);
      appendChips(subsubBlock, bucket[subsubgroup]);
      subgroupCard.appendChild(subsubBlock);
    });

    groupBlock.appendChild(subgroupCard);
  });
});

/* ---------- Navigation entre pages (onglets) ---------- */
const PAGES = ['concepts', 'syntaxes', 'lexique', 'references'];
const BRAND_SUBTITLE = {concepts:"concepts & fondations", syntaxes:"aide-mémoire par cas d'usage", lexique:"lexique & définitions", references:"références & liens"};
const DEFAULT_ID = {concepts: CONCEPTS_SECTIONS[0].id, syntaxes: SYNTAXES_SECTIONS[0].id, references: REFERENCES_SECTIONS[0].id};
const lastSectionForPage = {};
let currentPage = 'concepts';

const idToPage = {};
CONCEPTS_SECTIONS.forEach(s => idToPage[s.id] = 'concepts');
SYNTAXES_SECTIONS.forEach(s => idToPage[s.id] = 'syntaxes');
REFERENCES_SECTIONS.forEach(s => idToPage[s.id] = 'references');

function showPage(page){
  if (!PAGES.includes(page)) return;
  currentPage = page;
  document.getElementById('sidebar').dataset.page = page;
  document.querySelectorAll('.top-tab').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.querySelectorAll('.page-navbody').forEach(el => el.classList.toggle('active', el.id === 'navbody-' + page));
  document.querySelectorAll('.page-main').forEach(el => el.classList.toggle('active', el.id === 'mainpage-' + page));
  document.getElementById('brand-subtitle').textContent = BRAND_SUBTITLE[page];
}

function showSection(id){
  const page = idToPage[id];
  if (page){
    lastSectionForPage[page] = id;
    if (page !== currentPage) showPage(page);
  }
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.target === id);
  });
  document.querySelectorAll('.panel').forEach(el => {
    el.classList.toggle('active', el.id === 'panel-' + id);
  });
  const activeBtn = document.querySelector('.nav-item[data-target="' + id + '"]');
  if (activeBtn){
    activeBtn.closest('.nav-group').classList.remove('collapsed');
    const subgroupEl = activeBtn.closest('.nav-subgroup');
    if (subgroupEl) subgroupEl.classList.remove('collapsed');
  }
  if (window.location.hash.slice(1) !== id) window.location.hash = id;
  document.getElementById('main-root').scrollTo(0, 0);
  window.scrollTo(0, 0);
}

document.querySelectorAll('.top-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const page = btn.dataset.page;
    if (page === 'lexique'){
      if (window.location.hash.slice(1) === 'lexique') showPage('lexique');
      else window.location.hash = 'lexique';
    } else {
      window.location.hash = lastSectionForPage[page] || DEFAULT_ID[page];
    }
  });
});

function routeToHash(){
  const id = window.location.hash ? window.location.hash.slice(1) : '';
  if (id && idToPage[id]){
    showSection(id);
  } else if (id === 'lexique'){
    showPage('lexique');
  } else if (!id){
    showPage('concepts');
    showSection(DEFAULT_ID.concepts);
  }
}
window.addEventListener('hashchange', routeToHash);
routeToHash();
</script>

<script>
/* ---------- Nav par lettre du Lexique (scroll-spy) ---------- */
(function(){
  const letterLinks = Array.from(document.querySelectorAll('.nav-letter'));
  const letterSections = letterLinks.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  function onScroll(){
    let activeIdx = 0;
    for (let i = 0; i < letterSections.length; i++){
      if (letterSections[i] && letterSections[i].getBoundingClientRect().top < 120) activeIdx = i;
    }
    letterLinks.forEach((a, i) => a.classList.toggle('active', i === activeIdx));
  }
  document.getElementById('main-root').addEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll);
  onScroll();
})();

<script>
/* ---------- Recherche globale (sur toutes les pages, actives ou non) ---------- */
(function(){
  const searchInput = document.getElementById('search-input');
  const prevBtn = document.getElementById('search-prev');
  const nextBtn = document.getElementById('search-next');
  const countEl = document.getElementById('search-count');
  const rootEl = document.getElementById('main-root');

  let searchMarks = [];
  let currentIndex = -1;

  function escapeRegExp(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function clearMarks(){
    searchMarks.forEach(mark => {
      const parent = mark.parentNode;
      if (!parent) return;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    });
    searchMarks = [];
    currentIndex = -1;
  }

  function highlightNode(node, pattern){
    const text = node.nodeValue;
    const regex = new RegExp(pattern, 'gi');
    regex.lastIndex = 0;
    if (!regex.test(text)) return;
    regex.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIndex = 0, m;
    while ((m = regex.exec(text))){
      if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-mark';
      mark.textContent = m[0];
      frag.appendChild(mark);
      searchMarks.push(mark);
      lastIndex = m.index + m[0].length;
    }
    if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    node.parentNode.replaceChild(frag, node);
  }

  function buildMarks(query){
    const pattern = escapeRegExp(query);
    const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = node.parentElement;
        if (!p || p.closest('.katex') || p.closest('script,style')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(node => highlightNode(node, pattern));
  }

  function updateCount(){
    const hasQuery = searchInput.value.trim().length > 0;
    countEl.textContent = searchMarks.length ? (currentIndex + 1) + '/' + searchMarks.length : (hasQuery ? '0/0' : '');
    prevBtn.disabled = nextBtn.disabled = searchMarks.length === 0;
  }

  function goTo(idx){
    if (!searchMarks.length) return;
    if (currentIndex >= 0 && searchMarks[currentIndex]) searchMarks[currentIndex].classList.remove('current');
    currentIndex = ((idx % searchMarks.length) + searchMarks.length) % searchMarks.length;
    const mark = searchMarks[currentIndex];
    mark.classList.add('current');
    const panel = mark.closest('.panel');
    if (panel){
      if (!panel.classList.contains('active')) showSection(panel.id.replace('panel-', ''));
    } else {
      const pageMainEl = mark.closest('.page-main');
      if (pageMainEl){
        const pageKey = pageMainEl.id.replace('mainpage-', '');
        if (pageKey !== currentPage) showPage(pageKey);
      }
    }
    mark.scrollIntoView({behavior: 'smooth', block: 'center'});
    updateCount();
  }

  function runSearch(){
    clearMarks();
    const q = searchInput.value.trim();
    if (!q){ updateCount(); return; }
    buildMarks(q);
    if (searchMarks.length) goTo(0); else updateCount();
  }

  searchInput.addEventListener('input', runSearch);
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      goTo(currentIndex + (e.shiftKey ? -1 : 1));
    } else if (e.key === 'Escape'){
      searchInput.value = '';
      clearMarks();
      updateCount();
      searchInput.blur();
    }
  });
  prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
  nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput &&
        !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)){
      e.preventDefault();
      searchInput.focus();
    }
  });
})();
</script>
